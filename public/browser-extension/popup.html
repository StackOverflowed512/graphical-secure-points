
<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Password Manager</title>
  <style>
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      width: 320px;
      margin: 0;
      padding: 0;
      color: #333;
    }
    .header {
      background-color: #f5f5f5;
      padding: 12px;
      border-bottom: 1px solid #ddd;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }
    .header h1 {
      font-size: 16px;
      margin: 0;
    }
    .content {
      padding: 12px;
    }
    .login-button {
      display: block;
      width: 100%;
      padding: 8px;
      background-color: #4CAF50;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-size: 14px;
      margin-top: 12px;
    }
    .login-button:disabled {
      background-color: #cccccc;
      cursor: not-allowed;
    }
    .password-item {
      padding: 10px;
      border: 1px solid #ddd;
      border-radius: 4px;
      margin-bottom: 8px;
      cursor: pointer;
    }
    .password-item:hover {
      background-color: #f5f5f5;
    }
    .password-title {
      font-weight: bold;
      margin-bottom: 4px;
    }
    .password-username {
      color: #666;
      font-size: 12px;
    }
    .message {
      padding: 12px;
      background-color: #e8f5e9;
      border-radius: 4px;
      margin-bottom: 12px;
      font-size: 14px;
    }
    .error {
      background-color: #ffebee;
    }
  </style>
</head>
<body>
  <div class="header">
    <h1>Password Manager</h1>
  </div>
  
  <div class="content">
    <div id="login-container">
      <p>Sign in to access your passwords</p>
      <button id="login-button" class="login-button">Open Password Manager</button>
    </div>
    
    <div id="passwords-container" style="display: none;">
      <div id="message" style="display: none;"></div>
      
      <p>Select a password to autofill:</p>
      <div id="passwords-list"></div>
    </div>
  </div>
  
  <script src="popup.js"></script>
</body>
</html>
